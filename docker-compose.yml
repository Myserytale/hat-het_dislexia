version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hat_het_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./hat_het_dislexia.db
      - PROJECT_NAME=Hát-Hét Dislexia
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend/hat_het_dislexia.db:/app/hat_het_dislexia.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hat_het_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  # Optional PostgreSQL service for production or advanced testing
  postgres:
    image: postgres:16-alpine
    container_name: hat_het_postgres
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      POSTGRES_USER: hat_het_user
      POSTGRES_PASSWORD: hat_het_password
      POSTGRES_DB: hat_het_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
